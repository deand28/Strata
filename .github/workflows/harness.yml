name: Local harness
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU test dependencies
        run: python -m pip install jinja2 pyyaml regex numpy requests pillow psutil
      - name: Test harness and existing server interfaces
        run: python -m unittest serve.test_voice serve.test_harness serve.test_mcp serve.test_web_sampling serve.test_frontend serve.test_server
      - name: Python syntax
        run: python -m py_compile serve/voice.py serve/harness.py serve/server.py serve/mcp.py
      - name: Chat script syntax
        run: node --check serve/web/app.js
      - name: Harness script syntax
        run: node --check serve/web/harness.js
      - name: Voice script syntax
        run: node --check serve/web/voice.js
      - name: Voice lifecycle and spoken prose
        run: node serve/test_voice_state.js
      - name: Whitespace
        run: git diff --check
